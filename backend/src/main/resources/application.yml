spring:
  application:
    name: peachhacks-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/peachhacks}
    username: ${SPRING_DATASOURCE_USERNAME:peachhacks}
    password: ${SPRING_DATASOURCE_PASSWORD:peachhacks}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  docker:
    compose:
      enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    # A request refused before its body is read (an oversized resume) is still drained up
    # to this size, so the client receives the error instead of a reset connection.
    max-swallow-size: 16MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://www.peachhacks.com,https://peachhacks.com,https://admin.peachhacks.com}
  email:
    resend-api-key: ${RESEND_API_KEY:}
    resend-base-url: https://api.resend.com
    from: ${EMAIL_FROM:PeachHacks <hello@peachhacks.com>}
    web-base-url: ${WEB_BASE_URL:http://localhost:5173}
    admin-base-url: ${ADMIN_BASE_URL:http://localhost:5174}
    campaign-delay: 600ms
  google-wallet:
    issuer-id: ${GOOGLE_WALLET_ISSUER_ID:}
    service-account-email: ${GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL:}
    private-key: ${GOOGLE_WALLET_PRIVATE_KEY:}
    class-id: ${GOOGLE_WALLET_CLASS_ID:peachhacks_2027}
  acceptance:
    host-school-name: ${HOST_SCHOOL_NAME:Georgia State University}
    host-school-target: ${HOST_SCHOOL_TARGET:0.70}
    non-host-minimum-age: ${NON_HOST_MINIMUM_AGE:18}
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    bootstrap-name: ${ADMIN_BOOTSTRAP_NAME:}
    session-ttl: 12h
  rate-limit:
    public-per-minute: 60
    login-per-minute: 10
    ticket-per-minute: 300
    # The two sign-up POSTs: per client address, and across all addresses together.
    sign-up-per-window: ${SIGN_UP_LIMIT_PER_ADDRESS:30}
    sign-up-window: 10m
    sign-up-global-per-hour: ${SIGN_UP_LIMIT_PER_HOUR:1000}
    # Failed sign-ins for one email, whatever address they come from.
    login-failures-per-account: 10
    login-failure-window: 15m
    trust-forwarded-for: false
