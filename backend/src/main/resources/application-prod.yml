spring:
  docker:
    compose:
      enabled: false
  datasource:
    hikari:
      maximum-pool-size: 5

app:
  email:
    web-base-url: ${WEB_BASE_URL:https://www.peachhacks.com}
    admin-base-url: ${ADMIN_BASE_URL:https://admin.peachhacks.com}
  platform:
    base-url: ${PLATFORM_BASE_URL:https://platform.peachhacks.com}
    api-base-url: ${API_BASE_URL:https://api.peachhacks.com}
  rate-limit:
    trust-forwarded-for: true
